<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: radial-gradient(circle at center, rgb(18,18,18) 0%, rgb(3,3,3) 100%);

  inset: 0;

  background: repeating-linear-gradient(
    to bottom,

<body>

<main class="system">

  <div class="top">
    <span>RECOVERY: 0%</span>
    <span class="critical">● CRITICAL</span>
  </div>

  <div class="level">LEVEL 01 / 04 · 5 КЛАС</div>

  <h1>SYSTEM FAILURE</h1>

  <div class="message">
    ШКІЛЬНУ СИСТЕМУ ЗАБЛОКОВАНО.
    <br>
    ДОСТУП ДО НАСТУПНОГО РІВНЯ МОЖЛИВИЙ ЛИШЕ ЗА КОДОМ ДОСТУПУ.
    <br><br>
    КОД ДОСТУПУ В КАБІНЕТІ ВЧИТЕЛЯ №___
  </div>

  <label for="password">ACCESS CODE</label>

  <input
    id="password"
    type="text"
    autocomplete="off"
    placeholder="Введіть код доступу"
  >

  <button id="verify">VERIFY CODE</button>

  <div id="result" aria-live="polite"></div>

</main>

<script>
const CORRECT_PASSWORD = "parol";
const NEXT_PAGE = "level-2.html";

function checkPassword() {
  const input = document.getElementById("password").value.trim();
  const result = document.getElementById("result");

  if (
    input.toLowerCase() === CORRECT_PASSWORD.toLowerCase() &&
    !CORRECT_PASSWORD.startsWith("CHANGE_ME_")
  ) {
    result.innerHTML = `
      <div class="granted">ACCESS GRANTED</div>
      <div>VERIFYING...</div>
      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="restored">LEVEL 01 RESTORED</div>
    `;

    document.getElementById("progressBar").style.width = "100%";

    document.getElementById("password").disabled = true;
    document.getElementById("verify").disabled = true;

    setTimeout(() => {
      window.location.href = NEXT_PAGE;
    }, 2200);

  } else {
    result.innerHTML = `
      <div class="denied">ACCESS DENIED</div>
      <div>INVALID ACCESS CODE.<br>TRY AGAIN.</div>
    `;

    document.getElementById("password").value = "";
    document.getElementById("password").focus();
  }
}

document.getElementById("verify").addEventListener("click", checkPassword);

document.getElementById("password").addEventListener("keydown", e => {
  if (e.key === "Enter") checkPassword();
});
</script>

</body>
</html>
