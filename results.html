
<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RESULTS // Зламана школа</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #05070b;
  --text: #edf5fa;
  --muted: #8295a3;
  --red: #ff334f;
  --green: #42f0ad;
  --cyan: #51dff5;
  --gold: #ffd36b;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  color: var(--text);
  font-family: "Share Tech Mono", monospace;
  background: radial-gradient(ellipse at 50% -15%, #3a101b 0%, #101722 35%, var(--bg) 75%);
  overflow-x: hidden;
}

body:before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .2;
  background-image:
    linear-gradient(#ff52600b 1px, transparent 1px),
    linear-gradient(90deg, #ff52600b 1px, transparent 1px);
  background-size: 36px 36px;
}

body:after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(to bottom, transparent 0 3px, #ffffff04 4px);
}

.wrap {
  position: relative;
  z-index: 1;
  width: min(1000px, calc(100% - 30px));
  margin: auto;
  padding: 42px 0 60px;
}

header {
  text-align: center;
  margin-bottom: 22px;
  padding-right: 185px;
  min-height: 115px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.eyebrow {
  display: inline-block;
  color: var(--green);
  border: 1px solid #42f0ad66;
  background: #42f0ad0c;
  border-radius: 30px;
  padding: 9px 16px;
  font: 600 10px Orbitron, sans-serif;
  letter-spacing: 3px;
  box-shadow: 0 0 25px #42f0ad22;
}

h1 {
  font: 800 clamp(27px, 6vw, 49px) Orbitron, sans-serif;
  letter-spacing: 3px;
  margin: 18px 0 8px;
  color: var(--green);
  text-shadow: 0 0 25px #42f0ad77;
}

.subtitle {
  color: var(--muted);
  font-size: 13px;
  letter-spacing: 1px;
}

/* КОМПАКТНИЙ ТАЙМЕР */

.summary {
  position: absolute;
  top: 42px;
  right: 0;
  width: 170px;
  text-align: center;
  padding: 12px 10px;
  margin: 0;
  border: 1px solid #287d61;
  border-radius: 12px;
  background: linear-gradient(145deg, #10251f, #08120f);
  box-shadow: 0 0 25px #42f0ad20;
  z-index: 2;
}

.summary-label {
  color: var(--green);
  font: 600 8px Orbitron, sans-serif;
  letter-spacing: 1.2px;
}

.summary-time {
  font: 800 clamp(18px, 2.2vw, 25px) Orbitron, sans-serif;
  color: #fff;
  text-shadow: 0 0 15px #42f0ad88;
  margin: 7px 0 4px;
  font-variant-numeric: tabular-nums;
}

.summary-note {
  color: var(--muted);
  font-size: 9px;
}

/* ВКЛАДКИ */

.tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 17px;
}

.tab {
  position: relative;
  padding: 17px 8px;
  border: 1px solid #293b49;
  border-radius: 11px;
  background: linear-gradient(145deg, #111c29, #080d14);
  color: var(--muted);
  cursor: pointer;
  text-align: center;
  transition: .25s;
  font-family: "Share Tech Mono", monospace;
}

.tab:hover {
  border-color: var(--cyan);
  color: var(--text);
  transform: translateY(-2px);
}

.tab.active {
  color: var(--green);
  border-color: var(--green);
  background: linear-gradient(145deg, #123025, #091710);
  box-shadow: 0 0 24px #42f0ad22, inset 0 0 18px #42f0ad0b;
}

.tab-title {
  display: block;
  font: 700 clamp(9px, 2vw, 12px) Orbitron, sans-serif;
  letter-spacing: 1px;
}

.tab-subtitle {
  display: block;
  margin-top: 7px;
  font-size: 10px;
  opacity: .75;
}

.tab-count {
  display: inline-block;
  margin-top: 9px;
  padding: 4px 9px;
  border-radius: 20px;
  background: #ffffff0b;
  font-size: 10px;
}

/* ПАНЕЛЬ РЕЙТИНГУ */

.category {
  padding: 28px;
  border: 1px solid #287d61;
  border-radius: 16px;
  background: linear-gradient(145deg, #111c29ed, #080d14f5);
  box-shadow: 0 18px 50px #0008, 0 0 25px #42f0ad0c;
  animation: appear .35s ease;
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.category-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 20px;
}

.category-title {
  font: 700 clamp(13px, 3vw, 17px) Orbitron, sans-serif;
  letter-spacing: 1.5px;
}

.category-tag {
  color: var(--cyan);
  border: 1px solid #51dff555;
  background: #51dff50c;
  border-radius: 20px;
  padding: 7px 10px;
  font-size: 10px;
  white-space: nowrap;
}

.podium {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.podium-card {
  text-align: center;
  padding: 20px 10px;
  border: 1px solid #314352;
  border-radius: 12px;
  background: #080e15;
  min-width: 0;
}

.podium-card.first {
  border-color: #ffd36b;
  background: radial-gradient(ellipse at 50% 0%, #604719 0%, #241b0c 55%, #11100c 100%);
  box-shadow: 0 0 35px #ffd36b33, inset 0 0 25px #ffd36b12;
  transform: scale(1.035);
}

.medal {
  font-size: 27px;
  margin-bottom: 9px;
}

.place {
  color: var(--muted);
  font: 600 10px Orbitron, sans-serif;
  letter-spacing: 1px;
}

.team {
  margin: 10px 0;
  font: 700 clamp(11px, 2.5vw, 15px) Orbitron, sans-serif;
  overflow-wrap: anywhere;
}

.first .team {
  color: var(--gold);
  text-shadow: 0 0 13px #ffd36b55;
}

.time {
  color: var(--green);
  font-size: clamp(13px, 3vw, 17px);
  font-weight: bold;
  font-variant-numeric: tabular-nums;
}

.ranking {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.rank-row {
  display: grid;
  grid-template-columns: 42px 1fr auto;
  align-items: center;
  gap: 12px;
  padding: 13px 14px;
  border: 1px solid #263744;
  border-radius: 9px;
  background: #080e15;
  transition: .2s;
}

.rank-row:hover {
  border-color: #51dff577;
  background: #101b26;
}

.rank-number {
  color: var(--cyan);
  font: 700 15px Orbitron, sans-serif;
}

.rank-name {
  font-size: 13px;
  overflow-wrap: anywhere;
}

.rank-time {
  color: var(--green);
  font-size: 13px;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.empty {
  padding: 25px;
  text-align: center;
  border: 1px dashed #344653;
  border-radius: 10px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.9;
}

.footer {
  text-align: center;
  margin-top: 30px;
  color: #657785;
  font-size: 10px;
  line-height: 1.9;
}

.back-button {
  display: block;
  margin: 25px auto 0;
  padding: 14px 22px;
  border: 1px solid #51dff577;
  border-radius: 8px;
  color: var(--cyan);
  background: #51dff50c;
  font: 600 10px Orbitron, sans-serif;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: .2s;
}

.back-button:hover {
  background: #51dff522;
  box-shadow: 0 0 22px #51dff522;
  transform: translateY(-2px);
}

/* АДАПТАЦІЯ ДЛЯ ТЕЛЕФОНІВ */

@media(max-width: 650px) {
  header {
    padding-right: 0;
    min-height: 0;
    margin-bottom: 18px;
  }

  .summary {
    position: relative;
    top: auto;
    right: auto;
    width: min(230px, 100%);
    margin: 0 auto 18px;
  }
}

@media(max-width: 560px) {
  .wrap { padding-top: 25px; }
  .category { padding: 15px; }
  .tabs { gap: 6px; }
  .tab { padding: 13px 4px; }
  .tab-subtitle { font-size: 9px; }
  .podium { gap: 6px; }
  .podium-card { padding: 15px 5px; }

  .rank-row {
    grid-template-columns: 30px 1fr auto;
    gap: 7px;
    padding: 12px 9px;
  }

  .rank-name, .rank-time { font-size: 11px; }
}

/* =================================
   WOW EFFECTS // FINAL RESULTS
================================= */

header {
  animation: headerReveal 1s ease both;
}

@keyframes headerReveal {
  0% {
    opacity: 0;
    transform: translateY(-25px);
    filter: blur(8px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
    filter: blur(0);
  }
}

/* ВАЖЛИВО: не перезаписуємо позицію таймера */
.summary {
  position: absolute;
  top: 42px;
  right: 0;
  width: 170px;
  overflow: hidden;
  animation: summaryPulse 3s ease-in-out infinite;
}

@keyframes summaryPulse {
  0%, 100% { box-shadow: 0 0 15px #42f0ad18; }
  50% { box-shadow: 0 0 28px #42f0ad44; }
}

.summary:after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 45%;
  height: 100%;
  background: linear-gradient(90deg, transparent, #42f0ad18, transparent);
  transform: skewX(-20deg);
  animation: summaryScan 5s ease-in-out infinite;
  pointer-events: none;
}

@keyframes summaryScan {
  0%, 35% { left: -100%; }
  75%, 100% { left: 150%; }
}

.tab { overflow: hidden; }

.tab.active {
  animation: tabGlow 2.5s ease-in-out infinite;
}

@keyframes tabGlow {
  0%, 100% { box-shadow: 0 0 15px #42f0ad18; }
  50% { box-shadow: 0 0 30px #42f0ad55; }
}

.category {
  position: relative;
  overflow: hidden;
  animation: categoryEnter .45s ease both;
}

@keyframes categoryEnter {
  from {
    opacity: 0;
    transform: translateY(15px) scale(.985);
    filter: blur(5px);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
    filter: blur(0);
  }
}

.category:after {
  content: "";
  position: absolute;
  top: 0;
  left: -100%;
  width: 35%;
  height: 100%;
  background: linear-gradient(90deg, transparent, #42f0ad0c, transparent);
  transform: skewX(-18deg);
  animation: categoryScan 5s ease-in-out infinite;
  pointer-events: none;
}

@keyframes categoryScan {
  0%, 30% { left: -100%; }
  75%, 100% { left: 150%; }
}

/* ПЕРШЕ МІСЦЕ */

.podium-card.first {
  position: relative;
  overflow: hidden;
  animation: championPulse 2.4s ease-in-out infinite;
}

@keyframes championPulse {
  0%, 100% {
    box-shadow: 0 0 20px #ffd36b18;
    transform: translateY(0);
  }
  50% {
    box-shadow: 0 0 38px #ffd36b55;
    transform: translateY(-4px);
  }
}

.podium-card.first .medal {
  animation: trophyFloat 2s ease-in-out infinite;
  filter: drop-shadow(0 0 10px #ffd36b88);
}

@keyframes trophyFloat {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-7px) rotate(4deg); }
}

.podium-card:not(.first) {
  animation: podiumAppear .7s ease both;
}

.podium-card:nth-child(2) { animation-delay: .12s; }
.podium-card:nth-child(3) { animation-delay: .24s; }

@keyframes podiumAppear {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.rank-row { animation: rowAppear .4s ease both; }
.rank-row:nth-child(1) { animation-delay: .08s; }
.rank-row:nth-child(2) { animation-delay: .16s; }
.rank-row:nth-child(3) { animation-delay: .24s; }
.rank-row:nth-child(4) { animation-delay: .32s; }

@keyframes rowAppear {
  from {
    opacity: 0;
    transform: translateX(-12px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

.podium-card.first .team {
  animation: goldText 2s ease-in-out infinite;
}

@keyframes goldText {
  0%, 100% { text-shadow: 0 0 10px #ffd36b44; }
  50% { text-shadow: 0 0 24px #ffd36baa; }
}

/* ЗОЛОТІ ЧАСТИНКИ */

.particle {
  position: fixed;
  z-index: 100;
  top: -20px;
  pointer-events: none;
  animation: particleFall linear forwards;
}

@keyframes particleFall {
  0% {
    transform: translateY(-20px) rotate(0deg) scale(1);
    opacity: 1;
  }
  85% { opacity: 1; }
  100% {
    transform: translateY(110vh) rotate(720deg) scale(.4);
    opacity: 0;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
  }
}
</style>
</head>

<body>
<main class="wrap">

<header>
  <div class="eyebrow">SYSTEM RESTORED // FINAL REPORT</div>
  <h1>РЕЗУЛЬТАТИ КВЕСТУ</h1>
  <div class="subtitle">ЗЛАМАНА ШКОЛА · ТАБЛИЦЯ ПЕРЕМОЖЦІВ</div>
</header>

<section class="summary">
  <div class="summary-label">ЗАГАЛЬНИЙ ЧАС КВЕСТУ</div>
  <div class="summary-time" id="totalTime">00:00:00</div>
  <div class="summary-note" id="summaryNote">Завантаження результатів...</div>
</section>

<nav class="tabs" aria-label="Категорії результатів">
  <button class="tab active" data-tab="junior">
    <span class="tab-title">МОЛОДША</span>
    <span class="tab-subtitle">1, 3, 4 класи</span>
    <span class="tab-count" id="count-junior">0 / 3</span>
  </button>

  <button class="tab" data-tab="middle">
    <span class="tab-title">СЕРЕДНЯ ТА СТАРША</span>
    <span class="tab-subtitle">5–11 класи</span>
    <span class="tab-count" id="count-middle">0 / 4</span>
  </button>
</nav>

<div id="rankings"></div>

<button class="back-button" onclick="history.back()">
  ← ПОВЕРНУТИСЯ НАЗАД
</button>

<div class="footer">
  РЕЗУЛЬТАТИ ЗЧИТУЮТЬСЯ З ЛОКАЛЬНОЇ АДМІНПАНЕЛІ<br>
  ЗЛАМАНА ШКОЛА // SYSTEM REPORT
</div>

</main>

<script>
const KEY = "brokenSchoolAdmin_v1";

const GROUPS = [
  { id: "1", name: "1 клас", category: "junior" },
  { id: "3", name: "3 клас", category: "junior" },
  { id: "4", name: "4 клас", category: "junior" },

  { id: "5", name: "5-6 клас", category: "middle" },
  { id: "7.1", name: "7.1 клас", category: "middle" },
  { id: "7.2", name: "7.2 клас", category: "middle" },
  { id: "8-11", name: "7.2 клас", category: "middle" },

];

const CATEGORIES = {
  junior: {
    title: "МОЛОДША ШКОЛА",
    tag: "1, 3, 4 КЛАСИ",
    icon: "🟢",
    total: 3
  },
  middle: {
    title: "СЕРЕДНЯ ТА СТАРША ШКОЛИ",
    tag: "5, 6, 7.1, 7.2, 8-11 КЛАСИ",
    icon: "🔵",
    total: 4
  },

};

let currentTab = "junior";
let savedState = null;

function formatTime(ms) {
  let seconds = Math.max(0, Math.floor(ms / 1000));
  const hours = Math.floor(seconds / 3600);
  const minutes = Math.floor((seconds % 3600) / 60);
  const secs = seconds % 60;

  return [hours, minutes, secs]
    .map(x => String(x).padStart(2, "0"))
    .join(":");
}

function loadResults() {
  try {
    const saved = JSON.parse(localStorage.getItem(KEY));
    if (!saved || typeof saved !== "object") return null;
    return saved;
  } catch (error) {
    return null;
  }
}

function renderCategory(categoryId) {
  const category = CATEGORIES[categoryId];

  const groups = GROUPS
    .filter(g => g.category === categoryId)
    .filter(g => savedState.completed && savedState.completed[g.id])
    .sort((a, b) =>
      savedState.completed[a.id].timeMs -
      savedState.completed[b.id].timeMs
    );

  if (!groups.length) {
    return `
      <section class="category">
        <div class="category-head">
          <div class="category-title">
            ${category.icon} ${category.title}
          </div>
          <div class="category-tag">${category.tag}</div>
        </div>

        <div class="empty">
          РЕЗУЛЬТАТІВ ПОКИ НЕМАЄ<br>
          Очікуємо завершення групами цього рівня.
        </div>
      </section>
    `;
  }

  const podium = groups.slice(0, 3);

  const podiumHTML = podium.map((g, i) => `
    <div class="podium-card ${i === 0 ? "first" : ""}">
      <div class="medal">${["🏆", "🥈", "🥉"][i]}</div>
      <div class="place">${i + 1} МІСЦЕ</div>
      <div class="team">${g.name}</div>
      <div class="time">
        ${formatTime(savedState.completed[g.id].timeMs)}
      </div>
    </div>
  `).join("");

  const rankingHTML = groups.map((g, i) => `
    <div class="rank-row">
      <div class="rank-number">
        ${String(i + 1).padStart(2, "0")}
      </div>
      <div class="rank-name">${g.name}</div>
      <div class="rank-time">
        ${formatTime(savedState.completed[g.id].timeMs)}
      </div>
    </div>
  `).join("");

  return `
    <section class="category">
      <div class="category-head">
        <div class="category-title">
          ${category.icon} ${category.title}
        </div>
        <div class="category-tag">${category.tag}</div>
      </div>

      <div class="podium">${podiumHTML}</div>
      <div class="ranking">${rankingHTML}</div>
    </section>
  `;
}

function switchTab(tabId) {
  if (!CATEGORIES[tabId]) return;

  currentTab = tabId;

  document.querySelectorAll(".tab").forEach(button => {
    button.classList.toggle(
      "active",
      button.dataset.tab === tabId
    );
  });

  document.getElementById("rankings").innerHTML =
    renderCategory(tabId);
}

function render() {
  savedState = loadResults();

  if (!savedState) {
    document.getElementById("summaryNote").textContent =
      "Дані адмінпанелі не знайдено.";

    document.getElementById("rankings").innerHTML = `
      <div class="empty">
        НЕ ВДАЛОСЯ ЗАВАНТАЖИТИ РЕЗУЛЬТАТИ.<br>
        Переконайся, що адмінпанель і ця сторінка відкриті
        в одному браузері та з однієї адреси.
      </div>
    `;
    return;
  }

  document.getElementById("totalTime").textContent =
    formatTime(savedState.elapsedMs || 0);

  const completedCount = GROUPS.filter(g =>
    savedState.completed && savedState.completed[g.id]
  ).length;

  document.getElementById("summaryNote").textContent =
    `${completedCount} / ${GROUPS.length} ГРУП ЗАРАХОВАНО`;

  Object.keys(CATEGORIES).forEach(categoryId => {
    const count = GROUPS.filter(g =>
      g.category === categoryId &&
      savedState.completed &&
      savedState.completed[g.id]
    ).length;

    document.getElementById(`count-${categoryId}`).textContent =
      `${count} / ${CATEGORIES[categoryId].total}`;
  });

  switchTab(currentTab);
}

document.querySelectorAll(".tab").forEach(button => {
  button.addEventListener("click", () => {
    switchTab(button.dataset.tab);
  });
});

render();

/* GOLDEN PARTICLES // SYSTEM RESTORED */

function launchParticles() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;

  const symbols = ["✦", "✧", "◆", "★"];
  const colors = ["#ffd36b", "#42f0ad", "#51dff5", "#ff6678"];

  for (let i = 0; i < 55; i++) {
    const particle = document.createElement("div");

    particle.className = "particle";
    particle.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    particle.style.left = Math.random() * 100 + "vw";
    particle.style.color = colors[Math.floor(Math.random() * colors.length)];
    particle.style.fontSize = (10 + Math.random() * 13) + "px";
    particle.style.animationDuration = (3 + Math.random() * 4) + "s";
    particle.style.animationDelay = (Math.random() * 1.5) + "s";

    document.body.appendChild(particle);

    particle.addEventListener("animationend", () => particle.remove());
  }
}

launchParticles();
</script>
</body>
</html>
