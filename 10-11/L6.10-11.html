<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERROR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(circle at center, #f2f2f2 0%, #dedede 60%, #c9c9c9 100%);

            color: #333;
            font-family: "Courier New", monospace;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        .system {
            width: min(720px, 90%);

            padding: 45px 35px;

            border: 1px solid #999;

            background: rgba(250, 250, 250, 0.95);

            box-shadow:
                0 0 40px rgba(0,0,0,0.12),
                inset 0 0 50px rgba(255,255,255,0.5);

            text-align: center;
        }

        .title {
            color: #333;

            font-size: clamp(22px, 4vw, 34px);
            font-weight: bold;

            letter-spacing: 5px;

            margin-bottom: 22px;
        }

        .subtitle {
            color: #666;

            font-size: 13px;
            letter-spacing: 2px;

            margin-bottom: 42px;
        }

        .status {
            display: flex;
            justify-content: space-between;

            border-top: 1px solid #bbb;
            border-bottom: 1px solid #bbb;

            padding: 14px 0;
            margin-bottom: 40px;

            color: #666;
            font-size: 12px;
        }

        .status-ok {
            color: #555;
        }

        .level {
            font-size: 18px;

            letter-spacing: 4px;

            margin-bottom: 32px;

            color: #333;
        }

        .message {
            color: #555;

            line-height: 1.8;

            margin-bottom: 30px;

            font-size: 14px;
        }

        .label {
            color: #777;

            font-size: 11px;

            letter-spacing: 3px;

            margin-bottom: 12px;
        }

        input {
            width: min(360px, 100%);
            height: 55px;

            background: #fff;

            border: 1px solid #888;

            color: #222;

            text-align: center;

            font-family: "Courier New", monospace;
            font-size: 20px;

            letter-spacing: 6px;

            outline: none;

            transition: 0.2s;
        }

        input:focus {
            border-color: #333;

            box-shadow:
                0 0 18px rgba(0,0,0,0.08);
        }

        button {
            display: block;

            width: min(360px, 100%);
            height: 50px;

            margin: 18px auto 0;

            background: #e5e5e5;

            border: 1px solid #888;

            color: #333;

            font-family: "Courier New", monospace;

            font-size: 12px;
            letter-spacing: 3px;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #d5d5d5;
            color: #111;
            border-color: #555;
        }

        .result {
            min-height: 25px;

            margin-top: 25px;

            font-size: 13px;

            letter-spacing: 1px;
        }

        .denied {
            color: #555;
        }

        .granted {
            color: #333;
        }

        .progress {
            margin: 20px auto;

            width: min(360px, 100%);
            height: 8px;

            background: #d0d0d0;

            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;

            background: #555;

            transition: width 1.8s ease;
        }

        .restored {
            color: #222;

            font-size: 20px;

            letter-spacing: 4px;

            margin-top: 25px;
        }

        .final-message {
            margin-top: 15px;

            color: #666;

            font-size: 12px;

            line-height: 1.7;
        }

        .final-icon {
            font-size: 36px;

            margin-bottom: 20px;
        }

        @media (max-width: 600px) {

            .system {
                padding: 30px 20px;
            }

            .title {
                letter-spacing: 2px;
            }

            .status {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<div class="system" id="box">

    <div class="title">
        SYSTEM ONLINE
    </div>

    <div class="subtitle">
        ALL SYSTEMS OPERATIONAL
    </div>

    <div class="status">
        <span>RECOVERY: 99%</span>
        <span class="status-ok">● ONLINE</span>
    </div>

    <div class="level">
        LEVEL 06 / 06
    </div>

    <div class="message">
        СИСТЕМУ МАЙЖЕ ПОВНІСТЮ ВІДНОВЛЕНО.<br>
        ЦЕ ОСТАННІЙ РІВЕНЬ.<br>
        ВВЕДІТЬ ФІНАЛЬНИЙ КОД ДОСТУПУ.

        КОД ДОСТУПУ В КАБ. 
    </div>

    <div class="label">
        FINAL ACCESS CODE
    </div>

    <input
        type="text"
        id="password"
        autocomplete="off"
        spellcheck="false"
        maxlength="20"
    >

    <button onclick="checkPassword()">
        VERIFY CODE
    </button>

    <div class="result" id="result"></div>

</div>


<script>

    // ==========================================
    // ФІНАЛЬНИЙ ПАРОЛЬ
    // ==========================================

    const CORRECT_PASSWORD = "ACCESS-46";


    function checkPassword() {

        const input = document
            .getElementById("password")
            .value
            .trim();

        const result = document.getElementById("result");

        if (input === CORRECT_PASSWORD) {

            result.innerHTML = `
                <div class="granted">
                    ACCESS GRANTED
                </div>

                <div style="margin-top:10px;">
                    RESTORING FINAL SYSTEM...
                </div>

                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            `;

            document.getElementById("progressBar").style.width = "100%";

            document.getElementById("password").disabled = true;
            document.querySelector("button").disabled = true;

            setTimeout(() => {

                document.getElementById('box').innerHTML = `

                    <div style="font-size:36px">✓</div>

                    <h1>SYSTEM RESTORED</h1>

                    <div class="sub">FINAL RECOVERY COMPLETE</div>

                    <div class="status">
                        <span>RECOVERY: 100%</span>
                        <span>● ONLINE</span>
                    </div>

                    <div class="done" style="font-size:26px; margin-top:30px;">
                        FINAL CODE
                    </div>

                    <div style="font-size:34px; letter-spacing:6px; margin:20px 0;">
                        K7-X4-92
                    </div>

                    <div style="color:#aaa; font-size:13px; line-height:1.8;">
                        НАЗВІТЬ ЦЕЙ КОД ВЕДУЧОМУ
                    </div>

                `;

            }, 1800);

        } else {

            result.innerHTML = `
                <div class="denied">
                    ACCESS DENIED
                </div>

                <div style="margin-top:8px;">
                    INVALID ACCESS CODE.<br>
                    TRY AGAIN.
                </div>
            `;

            document.getElementById("password").value = "";
            document.getElementById("password").focus();
        }
    }


    document.getElementById("password").addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            checkPassword();
        }

    });

</script>

</body>
</html>
