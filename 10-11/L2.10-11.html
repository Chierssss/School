<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERROR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #242424 0%, #111 60%, #070707 100%);
            color: #dcdcdc;
            font-family: "Courier New", monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.018) 0px,
                rgba(255,255,255,0.018) 1px,
                transparent 1px,
                transparent 4px
            );
        }

        .system {
            width: min(720px, 90%);
            padding: 45px 35px;
            border: 1px solid #555;
            background: rgba(15, 15, 15, 0.95);
            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.8),
                inset 0 0 50px rgba(255,255,255,0.025);
            text-align: center;
        }

        .warning {
            color: #d07a00;
            font-size: clamp(22px, 4vw, 34px);
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 25px;
        }

        .subtitle {
            color: #999;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 45px;
        }

        .status {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #3a3a3a;
            border-bottom: 1px solid #3a3a3a;
            padding: 14px 0;
            margin-bottom: 40px;
            color: #888;
            font-size: 12px;
        }

        .warning-status {
            color: #c47b00;
        }

        .level {
            font-size: 18px;
            letter-spacing: 4px;
            margin-bottom: 35px;
            color: #c8c8c8;
        }

        .message {
            color: #aaa;
            line-height: 1.8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .label {
            color: #777;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        input {
            width: min(360px, 100%);
            height: 55px;
            background: #111;
            border: 1px solid #666;
            color: #eee;
            text-align: center;
            font-family: "Courier New", monospace;
            font-size: 20px;
            letter-spacing: 6px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #aaa;
            box-shadow: 0 0 15px rgba(255,255,255,0.07);
        }

        button {
            display: block;
            width: min(360px, 100%);
            height: 50px;
            margin: 18px auto 0;

            background: #202020;
            border: 1px solid #777;
            color: #bbb;

            font-family: "Courier New", monospace;
            font-size: 12px;
            letter-spacing: 3px;

            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #2b2b2b;
            color: white;
            border-color: #aaa;
        }

        .result {
            min-height: 25px;
            margin-top: 25px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .denied {
            color: #c47b00;
        }

        .granted {
            color: #bdbdbd;
        }

        .progress {
            margin: 20px auto;
            width: min(360px, 100%);
            height: 8px;
            background: #292929;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #bdbdbd;
            transition: width 1.5s ease;
        }

        .restored {
            color: #eee;
            font-size: 18px;
            letter-spacing: 4px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .system {
                padding: 30px 20px;
            }

            .warning {
                letter-spacing: 2px;
            }

            .status {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<div class="system">

    <div class="warning">
        SYSTEM RECOVERY
    </div>

    <div class="subtitle">
        ACCESS PARTIALLY RESTORED
    </div>

    <div class="status">
        <span>RECOVERY: 20%</span>
        <span class="warning-status">● WARNING</span>
    </div>

    <div class="level">
        LEVEL 02 / 06
    </div>

    <div class="message">
        СИСТЕМА ЧАСТКОВО ВІДНОВЛЕНА.<br>
        ДЕЯКІ МОДУЛІ ВСЕ ЩЕ ЗАБЛОКОВАНІ.<br>
        ВВЕДІТЬ КОД ДЛЯ ПРОДОВЖЕННЯ.

        КОД ДОСТУПУ В КАБ. 
    </div>

    <div class="label">
        ACCESS CODE
    </div>

    <input
        type="text"
        id="password"
        autocomplete="off"
        spellcheck="false"
        maxlength="20"
    >

    <button onclick="checkPassword()">
        VERIFY CODE
    </button>

    <div class="result" id="result"></div>

</div>


<script>

    // ПАРОЛЬ LEVEL 02
    const CORRECT_PASSWORD = "CHANGE_ME_2";

    // НАСТУПНА СТОРІНКА
    const NEXT_PAGE = "L3.10-11.html";


    function checkPassword() {

        const input = document
            .getElementById("password")
            .value
            .trim();

        const result = document.getElementById("result");

        if (input === CORRECT_PASSWORD) {

            result.innerHTML = `
                <div class="granted">
                    ACCESS GRANTED
                </div>

                <div style="margin-top:10px;">
                    VERIFYING...
                </div>

                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="restored">
                    LEVEL 02 RESTORED
                </div>
            `;

            document.getElementById("progressBar").style.width = "100%";

            document.getElementById("password").disabled = true;

            setTimeout(() => {
                window.location.href = NEXT_PAGE;
            }, 2500);

        } else {

            result.innerHTML = `
                <div class="denied">
                    ACCESS DENIED
                </div>

                <div style="margin-top:8px;">
                    INVALID ACCESS CODE.<br>
                    TRY AGAIN.
                </div>
            `;

            document.getElementById("password").value = "";
            document.getElementById("password").focus();
        }
    }


    document.getElementById("password").addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            checkPassword();
        }

    });

</script>

</body>
</html>
