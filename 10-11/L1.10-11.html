<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ERROR</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at center, #171717 0%, #080808 55%, #000 100%);
            color: #d8d8d8;
            font-family: "Courier New", monospace;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Легкий ефект старого монітора */
        body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.025) 0px,
                rgba(255,255,255,0.025) 1px,
                transparent 1px,
                transparent 4px
            );
        }

        .system {
            width: min(720px, 90%);
            padding: 45px 35px;
            border: 1px solid #3b3b3b;
            background: rgba(5, 5, 5, 0.94);
            box-shadow:
                0 0 40px rgba(0, 0, 0, 0.9),
                inset 0 0 40px rgba(255, 0, 0, 0.025);
            text-align: center;
        }

        .warning {
            color: #b80000;
            font-size: clamp(22px, 4vw, 34px);
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 25px;
            animation: flicker 2.5s infinite;
        }

        .subtitle {
            color: #777;
            font-size: 13px;
            letter-spacing: 2px;
            margin-bottom: 45px;
        }

        .status {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid #292929;
            border-bottom: 1px solid #292929;
            padding: 14px 0;
            margin-bottom: 40px;
            color: #666;
            font-size: 12px;
        }

        .critical {
            color: #a00000;
        }

        .level {
            font-size: 18px;
            letter-spacing: 4px;
            margin-bottom: 35px;
            color: #aaa;
        }

        .message {
            color: #888;
            line-height: 1.8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .label {
            color: #555;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 12px;
        }

        input {
            width: min(360px, 100%);
            height: 55px;
            background: #090909;
            border: 1px solid #454545;
            color: #eee;
            text-align: center;
            font-family: "Courier New", monospace;
            font-size: 20px;
            letter-spacing: 6px;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: #777;
            box-shadow: 0 0 15px rgba(255,255,255,0.05);
        }

        button {
            display: block;
            width: min(360px, 100%);
            height: 50px;
            margin: 18px auto 0;

            background: #151515;
            border: 1px solid #555;
            color: #aaa;

            font-family: "Courier New", monospace;
            font-size: 12px;
            letter-spacing: 3px;

            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #202020;
            color: white;
            border-color: #888;
        }

        .result {
            min-height: 25px;
            margin-top: 25px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .denied {
            color: #b00000;
        }

        .granted {
            color: #8f8f8f;
        }

        .progress {
            margin: 20px auto;
            width: min(360px, 100%);
            height: 8px;
            background: #181818;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #aaa;
            transition: width 1.5s ease;
        }

        .restored {
            color: #ddd;
            font-size: 18px;
            letter-spacing: 4px;
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        @keyframes flicker {
            0%, 18%, 22%, 63%, 65%, 100% {
                opacity: 1;
            }

            20%, 64% {
                opacity: 0.35;
            }
        }

        @media (max-width: 600px) {
            .system {
                padding: 30px 20px;
            }

            .warning {
                letter-spacing: 2px;
            }

            .status {
                font-size: 10px;
            }
        }
    </style>
</head>

<body>

<div class="system" id="system">

    <div class="warning">
        SYSTEM FAILURE
    </div>

    <div class="subtitle">
        UNAUTHORIZED ACCESS DETECTED
    </div>

    <div class="status">
        <span>RECOVERY: 00%</span>
        <span class="critical">● CRITICAL</span>
    </div>

    <div class="level">
        LEVEL 01 / 06
    </div>

    <div class="message">
        ШКІЛЬНУ СИСТЕМУ ЗАБЛОКОВАНО.<br>
        ДОСТУП ДО НАСТУПНОГО РІВНЯ МОЖЛИВИЙ<br>
        ЛИШЕ ЗА КОДОМ ДОСТУПУ.

        КОД ДОСТУПУ В КАБ. 
    </div>

    <div class="label">
        ACCESS CODE
    </div>

    <input
        type="text"
        id="password"
        autocomplete="off"
        spellcheck="false"
        maxlength="20"
    >

    <button onclick="checkPassword()">
        VERIFY CODE
    </button>

    <div class="result" id="result"></div>

</div>


<script>

    // ==========================================
    // ПАРОЛЬ ЦЬОГО РІВНЯ
    // ==========================================

    const CORRECT_PASSWORD = "CHANGE_ME";


    // ==========================================
    // КУДИ ПЕРЕХОДИТИ ПІСЛЯ ПРАВИЛЬНОГО ПАРОЛЯ
    // ==========================================

    const NEXT_PAGE = "L2.10-11.html";


    // ==========================================
    // ПЕРЕВІРКА ПАРОЛЮ
    // ==========================================

    function checkPassword() {

        const input = document
            .getElementById("password")
            .value
            .trim();

        const result = document.getElementById("result");

        if (input === CORRECT_PASSWORD) {

            result.innerHTML = `
                <div class="granted">
                    ACCESS GRANTED
                </div>

                <div style="margin-top:10px;">
                    VERIFYING...
                </div>

                <div class="progress">
                    <div class="progress-bar" id="progressBar"></div>
                </div>

                <div class="restored">
                    LEVEL 01 RESTORED
                </div>
            `;

            document.getElementById("progressBar").style.width = "100%";

            document.getElementById("password").disabled = true;

            setTimeout(() => {
                window.location.href = NEXT_PAGE;
            }, 2500);

        } else {

            result.innerHTML = `
                <div class="denied">
                    ACCESS DENIED
                </div>

                <div style="margin-top:8px;">
                    INVALID ACCESS CODE.<br>
                    TRY AGAIN.
                </div>
            `;

            document.getElementById("password").value = "";
            document.getElementById("password").focus();
        }
    }


    // Дозволяємо натискати Enter
    document.getElementById("password").addEventListener("keydown", function(event) {

        if (event.key === "Enter") {
            checkPassword();
        }

    });

</script>

</body>
</html>
