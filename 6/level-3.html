<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RECOVERY // 6 КЛАС</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background:
        radial-gradient(circle at 50% 45%, rgba(190,205,195,.22), transparent 55%),
        linear-gradient(135deg, #424b46, #626e66 55%, #3c4540);
    color: #e5ebe7;
    font-family: 'Share Tech Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background-image:
        linear-gradient(rgba(220,240,225,.045) 1px, transparent 1px),
        linear-gradient(90deg, rgba(220,240,225,.045) 1px, transparent 1px);
    background-size: 35px 35px;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        rgba(255,255,255,.025) 1px,
        transparent 3px,
        transparent 5px
    );
}

.system {
    position: relative;
    z-index: 1;
    width: min(720px, 100%);
    padding: clamp(24px, 5vw, 45px);
    background: rgba(18,24,21,.92);
    border: 1px solid #a0b0a4;
    box-shadow:
        0 0 40px rgba(0,0,0,.45),
        0 0 25px rgba(190,220,195,.10);
    animation: appear .8s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding-bottom: 15px;
    border-bottom: 1px solid #66756b;
    color: #c0ccc3;
    font-size: 12px;
    letter-spacing: 1px;
}

.online {
    color: #a9e5b5;
}

.level {
    margin-top: 30px;
    color: #c1d0c5;
    font-size: 13px;
    letter-spacing: 3px;
}

h1 {
    margin: 14px 0;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(25px, 5vw, 38px);
    font-weight: 700;
    letter-spacing: 2px;
    color: #f0f5f1;
}

.message {
    margin: 25px 0;
    color: #d0dad2;
    font-size: 14px;
    line-height: 1.9;
}

.progress-info {
    display: flex;
    justify-content: space-between;
    margin: 25px 0 8px;
    color: #c0ccc3;
    font-size: 12px;
    letter-spacing: 1px;
}

.progress {
    width: 100%;
    height: 8px;
    background: #39443d;
    overflow: hidden;
    border: 1px solid #718276;
}

.progress-bar {
    height: 100%;
    width: 50%;
    background: linear-gradient(90deg, #91b99b, #c5e8cc);
    box-shadow: 0 0 12px rgba(170,225,180,.35);
    transition: width 1.8s ease;
}

label {
    display: block;
    margin-bottom: 10px;
    color: #c0ccc3;
    font-size: 12px;
    letter-spacing: 2px;
}

input {
    width: 100%;
    padding: 15px;
    background: #101713;
    border: 1px solid #87998b;
    color: #fff;
    font: 16px 'Share Tech Mono', monospace;
    outline: none;
    transition: .25s;
}

input:focus {
    border-color: #c4e8cc;
    box-shadow: 0 0 12px rgba(170,225,180,.2);
}

button {
    margin-top: 15px;
    padding: 14px 22px;
    background: #3b5142;
    border: 1px solid #9bbba2;
    color: #f0f7f1;
    font: 13px 'Orbitron', sans-serif;
    letter-spacing: 2px;
    cursor: pointer;
    transition: .25s;
}

button:hover {
    background: #506b57;
    border-color: #c5e8cc;
    box-shadow: 0 0 15px rgba(170,225,180,.2);
}

button:disabled {
    opacity: .5;
    cursor: default;
}

#result {
    min-height: 75px;
    margin-top: 23px;
    font-size: 13px;
    line-height: 1.8;
    color: #c0ccc3;
}

.granted {
    color: #a6eab5;
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
}

.denied {
    color: #ff7777;
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
}

.restored {
    margin-top: 10px;
    color: #a6eab5;
}

.footer {
    margin-top: 25px;
    padding-top: 13px;
    border-top: 1px solid #59675d;
    display: flex;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    color: #a4b2a8;
    font-size: 10px;
    letter-spacing: 1px;
}
</style>
</head>

<body>

<main class="system">

    <div class="top">
        <span>RECOVERY: 50%</span>
        <span class="online">● ONLINE</span>
    </div>

    <div class="level">LEVEL 03 / 04 · 6 КЛАС</div>

    <h1>SYSTEM FAILURE</h1>

    <div class="message">
        СИСТЕМА ЧАСТКОВО ВІДНОВЛЕНА.<br>
        ДЕЯКІ МОДУЛІ ВСЕ ЩЕ ЗАБЛОКОВАНІ.<br>
        ВВЕДІТЬ КОД ДЛЯ ПРОДОВЖЕННЯ.<br><br>
        КОД ДОСТУПУ В КАБІНЕТІ ВЧИТЕЛЯ № ___
    </div>

    <div class="progress-info">
        <span>RESTORATION PROGRESS</span>
        <span id="progressText">50%</span>
    </div>

    <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
    </div>

    <br>

    <label for="password">ACCESS CODE</label>

    <input
        id="password"
        type="text"
        autocomplete="off"
        placeholder="Введіть код доступу"
    >

    <button id="verify">VERIFY CODE</button>

    <div id="result" aria-live="polite"></div>

    <div class="footer">
        <span>DEVICE ID: SCH-006</span>
        <span>MODULE 03 // LOCKED</span>
    </div>

</main>

<script>
const CORRECT_PASSWORD = "parol3";
const NEXT_PAGE = "level-4.html";

function checkPassword() {
    const input = document.getElementById("password").value.trim();
    const result = document.getElementById("result");
    const password = document.getElementById("password");
    const button = document.getElementById("verify");

    if (
        input.toLowerCase() === CORRECT_PASSWORD.toLowerCase() &&
        !CORRECT_PASSWORD.startsWith("CHANGE_ME_")
    ) {
        result.innerHTML = `
            <div class="granted">ACCESS GRANTED</div>
            <div>VERIFYING SYSTEM...</div>
            <div class="restored">LEVEL 03 RESTORED</div>
        `;

        document.getElementById("progressBar").style.width = "75%";
        document.getElementById("progressText").textContent = "75%";
        document.querySelector(".top span:first-child").textContent = "RECOVERY: 75%";

        password.disabled = true;
        button.disabled = true;

        setTimeout(() => {
            window.location.href = NEXT_PAGE;
        }, 2200);

    } else {
        result.innerHTML = `
            <div class="denied">ACCESS DENIED</div>
            <div>INVALID ACCESS CODE.<br>TRY AGAIN.</div>
        `;

        password.value = "";
        password.focus();
    }
}

document.getElementById("verify").addEventListener("click", checkPassword);

document.getElementById("password").addEventListener("keydown", function(e) {
    if (e.key === "Enter") {
        checkPassword();
    }
});
</script>

</body>
</html>
