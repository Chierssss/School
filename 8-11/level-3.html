<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Зламана школа — Рівень 3 · 8–11 класи</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
    --accent: #ffc247;
    --accent-glow: rgba(255, 194, 71, 0.35);
    --bg: #100d05;
    --panel: rgba(28, 23, 10, 0.94);
    --text: #fff8e6;
    --muted: #b9a77e;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
    background:
        radial-gradient(ellipse at center, rgba(160, 125, 20, 0.2), transparent 65%),
        linear-gradient(135deg, #050402, var(--bg));
    color: var(--text);
    font-family: 'Share Tech Mono', monospace;
    position: relative;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(rgba(255, 194, 71, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 194, 71, 0.035) 1px, transparent 1px);
    background-size: 35px 35px;
    animation: gridMove 12s linear infinite;
}

body::after {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,0,0,0.15) 4px
    );
}

@keyframes gridMove {
    from { background-position: 0 0; }
    to { background-position: 35px 35px; }
}

.system {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 620px;
    padding: 40px 35px;
    background: var(--panel);
    border: 1px solid rgba(255, 194, 71, 0.55);
    box-shadow:
        0 0 25px var(--accent-glow),
        inset 0 0 30px rgba(255, 194, 71, 0.045);
    animation: appear 0.8s ease both;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px) scale(0.97);
    }
    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}

.top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding-bottom: 15px;
    border-bottom: 1px solid rgba(255, 194, 71, 0.3);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 1px;
}

.critical {
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
}

.level {
    margin-top: 28px;
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
}

h1 {
    margin: 14px 0;
    color: #fff8e6;
    font-family: 'Orbitron', sans-serif;
    font-size: clamp(25px, 5vw, 36px);
    line-height: 1.3;
    text-shadow: 0 0 18px var(--accent-glow);
}

.message {
    margin: 22px 0 28px;
    color: #d9cfb6;
    font-size: 14px;
    line-height: 1.9;
}

label {
    display: block;
    margin-bottom: 10px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: 2px;
}

input {
    width: 100%;
    padding: 15px;
    background: #080704;
    border: 1px solid rgba(255, 194, 71, 0.5);
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    outline: none;
    transition: 0.3s;
}

input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 15px var(--accent-glow);
}

button {
    width: 100%;
    margin-top: 15px;
    padding: 15px;
    background: rgba(255, 194, 71, 0.1);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    cursor: pointer;
    transition: 0.3s;
}

button:hover {
    background: var(--accent);
    color: #171003;
    box-shadow: 0 0 22px var(--accent-glow);
}

button:disabled {
    opacity: 0.5;
    cursor: default;
}

#result {
    min-height: 75px;
    margin-top: 22px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
}

.granted {
    color: #8cff9b;
    font-family: 'Orbitron', sans-serif;
    font-size: 18px;
    margin-bottom: 8px;
}

.denied {
    color: #ff5555;
    font-family: 'Orbitron', sans-serif;
    font-size: 17px;
    margin-bottom: 8px;
}

.progress {
    width: 100%;
    height: 9px;
    margin: 12px 0;
    background: #29251b;
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
}

.progress-bar {
    width: 60%;
    height: 100%;
    background: #8cff9b;
    box-shadow: 0 0 12px rgba(140,255,155,0.4);
    transition: width 0.8s ease;
}

.restored {
    color: #8cff9b;
    margin-top: 10px;
}

.footer {
    margin-top: 25px;
    padding-top: 15px;
    border-top: 1px solid rgba(255, 194, 71, 0.2);
    color: var(--muted);
    font-size: 10px;
    letter-spacing: 2px;
    line-height: 2;
}

.footer span {
    color: var(--accent);
}

@media (max-width: 480px) {
    .system {
        padding: 30px 22px;
    }

    .top {
        font-size: 10px;
    }

    .message {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<main class="system">

    <div class="top">
        <span id="progressText">RECOVERY: 40%</span>
        <span class="critical">● ONLINE</span>
    </div>

    <div class="level">LEVEL 03 / 05 · 8–11 КЛАСИ</div>

    <h1>SYSTEM FAILURE</h1>

    <div class="message">
        СИСТЕМА ЧАСТКОВО ВІДНОВЛЕНА.
        <br>
        ДЕЯКІ МОДУЛІ ВСЕ ЩЕ ЗАБЛОКОВАНІ.
        <br>
        ВВЕДІТЬ КОД ДЛЯ ПРОДОВЖЕННЯ.
        <br><br>
        КОД ДОСТУПУ В КАБІНЕТІ №1 (ПАНІ ЛАДА)
    </div>

    <label for="password">ACCESS CODE</label>

    <input
        id="password"
        type="text"
        autocomplete="off"
        placeholder="Введіть код доступу"
    >

    <button id="verify">VERIFY CODE</button>

    <div id="result" aria-live="polite"></div>

    <footer class="footer">
        DEVICE ID: <span>SCH-089</span>
        <br>
        SECURITY LEVEL: <span>03 / 05</span>
        <br>
        SYSTEM STATUS: <span>PARTIALLY RESTORED</span>
    </footer>

</main>

<script>
const CORRECT_PASSWORD = "VIRUS";
const NEXT_PAGE = "level-4.html";

function checkPassword() {
    const input = document.getElementById("password").value.trim();
    const result = document.getElementById("result");

    if (
        input.toLowerCase() === CORRECT_PASSWORD.toLowerCase() &&
        !CORRECT_PASSWORD.startsWith("CHANGE_ME_")
    ) {
        result.innerHTML = `
            <div class="granted">ACCESS GRANTED</div>
            <div>VERIFYING...</div>
            <div class="progress">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="restored">LEVEL 03 RESTORED</div>
        `;

        document.getElementById("progressBar").style.width = "60%";
        document.getElementById("progressText").textContent = "RECOVERY: 60%";

        document.getElementById("password").disabled = true;
        document.getElementById("verify").disabled = true;

        setTimeout(() => {
            window.location.href = NEXT_PAGE;
        }, 2200);

    } else {
        result.innerHTML = `
            <div class="denied">ACCESS DENIED</div>
            <div>INVALID ACCESS CODE.<br>TRY AGAIN.</div>
        `;

        document.getElementById("password").value = "";
        document.getElementById("password").focus();
    }
}

document.getElementById("verify").addEventListener("click", checkPassword);

document.getElementById("password").addEventListener("keydown", e => {
    if (e.key === "Enter") {
        checkPassword();
    }
});
</script>

</body>
</html>
